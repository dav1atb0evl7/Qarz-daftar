services:
  - type: web
    name: qarz-daftar-pro
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --chdir backend"
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: qarz-daftar-db
          property: connectionString

databases:
  - name: qarz-daftar-db
    databaseName: qarz_daftar_db
    user: qarz_user
    plan: free
